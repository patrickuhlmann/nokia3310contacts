name: Build Main

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 20 1 * *'

jobs:
  build_and_test:
    name: "Build and Test"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build with Gradle
        run: ./gradlew build --no-daemon
        
      - name: Archive jars
        uses: actions/upload-artifact@v7
        with:
          name: jars
          path: build/libs
          
      - name: Archive reports
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: build/reports
